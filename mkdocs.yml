site_name: Noqlen Meta
site_description: Multi-provider metadata enrichment and MusicBrainz identity tools for beets
repo_url: https://github.com/jssantogit/noqlen-meta-plugin
repo_name: jssantogit/noqlen-meta-plugin
edit_uri: edit/main/site-docs/
docs_dir: site-docs
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Start Here:
      - What is Noqlen Meta?: start-here/index.md
      - Installation: start-here/installation.md
      - Basic Configuration: start-here/basic-configuration.md
      - Your First Preview: start-here/first-preview.md
      - Understanding the Results: start-here/understanding-results.md
      - Apply Your First Changes: start-here/apply-changes.md
      - Write Changes to Your Files: start-here/write-files.md
  - Configuration:
      - Configuration Overview: configuration/index.md
      - Fields: configuration/fields.md
      - Providers: configuration/providers.md
      - Genres & Styles: configuration/genres-styles.md
      - Moods: configuration/moods.md
      - Artwork: configuration/artwork.md
      - BPM: configuration/bpm.md
      - Lyrics & Languages: configuration/lyrics-languages.md
      - AcoustID: configuration/acoustid.md
      - Advanced Resolution: configuration/advanced-resolution.md
      - Full Configuration Example: configuration/full-example.md
  - Concepts:
      - concepts/index.md
      - Database, Files, and Navidrome: concepts/database-files-navidrome.md
      - Preview, Apply, and Write: concepts/preview-apply-write.md
      - Strict and Partial: concepts/strict-vs-partial.md
      - Result Statuses: concepts/result-statuses.md
      - Providers and Field Authority: concepts/providers-and-field-authority.md
  - How-to Guides:
      - guides/index.md
      - Import Enrichment: guides/import-enrichment.md
      - Existing Library: guides/existing-library.md
      - MusicBrainz Identity: guides/musicbrainz-identity.md
      - Identity Tags: guides/identity-tags.md
      - Navidrome Workflow: guides/navidrome.md
      - Whole Library: guides/whole-library.md
  - Technical Reference:
      - technical-reference/index.md
      - Commands: technical-reference/command-line.md
      - Configuration: technical-reference/configuration.md
      - Providers: technical-reference/providers.md
      - Fields: technical-reference/fields.md
      - Compatibility: technical-reference/compatibility.md
      - beets Interaction: technical-reference/beets-interaction.md
  - Troubleshooting: troubleshooting/index.md
  - Advanced:
      - Safety: advanced/safety.md
      - Architecture: advanced/architecture.md
  - Project:
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
      - Release: project/release.md
