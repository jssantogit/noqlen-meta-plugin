site_name: Noqlen Meta
site_description: Multi-provider metadata enrichment and MusicBrainz identity tools for beets
repo_url: https://github.com/jssantogit/noqlen-meta-plugin
repo_name: jssantogit/noqlen-meta-plugin
edit_uri: edit/main/site-docs/
docs_dir: site-docs
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Start Here:
      - Start Here: start-here/index.md
      - Quickstart — One Album: start-here/quickstart.md
      - Installation: start-here/installation.md
