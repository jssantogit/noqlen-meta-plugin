[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-noqlenmeta"
version = "2.0.0"
description = "Multi-provider metadata enrichment and MusicBrainz identity tools for beets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "beets>=2.12,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["beets", "metadata", "musicbrainz", "discogs", "music-library"]

[project.urls]
Documentation = "https://noqlen-meta.readthedocs.io/en/stable/"
Repository = "https://github.com/jssantogit/noqlen-meta-plugin"
Issues = "https://github.com/jssantogit/noqlen-meta-plugin/issues"
Changelog = "https://github.com/jssantogit/noqlen-meta-plugin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
audio = [
    "librosa>=0.11,<1",
]
discogs = [
    "python3-discogs-client>=2.8,<3",
]
dev = [
    "build>=1.2",
    "packaging>=24",
    "pytest>=8",
    "python3-discogs-client>=2.8,<3",
    "ruff>=0.9",
    "tomli>=2; python_version < '3.11'",
    "twine>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["beetsplug.noqlenmeta*"]
namespaces = true

[tool.setuptools.package-data]
"beetsplug.noqlenmeta.genre_taxonomy" = ["genres.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "live: opt-in tests that contact real external services",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
